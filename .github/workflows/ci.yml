name: Discipline OS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Nightly at 06:00 UTC, full matrix incl. Node 20 (LTS) and Node 22.
  schedule:
    - cron: '0 6 * * *'

# Cancel in-progress runs on the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.node-version }}
          path: |
            .next
            supabase/.temp
          retention-days: 7
          if-no-files-found: ignore

  rls-smoke:
    # RLS smoke test against a real Postgres. Runs only when the
    # SUPABASE_DB_URL secret is configured on the repo (nightly +
    # manual dispatch). The secret is intentionally not provided in
    # the public PR fork path.
    name: RLS smoke (Postgres)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - name: Run RLS smoke
        if: env.SUPABASE_DB_URL != ''
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: bash scripts/rls-test.sh
      - name: Skip
        if: env.SUPABASE_DB_URL == ''
        run: echo "SUPABASE_DB_URL not configured; skipping RLS smoke (expected for forks)."

  e2e-smoke:
    # Playwright e2e smoke. Runs only on the main branch (or
    # manual dispatch) because it boots the dev server. Set
    # E2E_FULL=1 to run the full suite; otherwise only the
    # smoke spec executes.
    name: E2E smoke
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Build app
        env:
          # Placeholders; the e2e suite doesn't need a real DB.
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
        run: npm run build
      - name: Run e2e smoke
        env:
          E2E: '1'
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
        run: npx playwright test

  security-headers:
    # Verifies that the security headers the app sends are present and
    # well-formed. Runs against a built app served by `next start`.
    name: Security headers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Start app
        env:
          # Placeholders; the route is the security check, not the data.
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
        run: npx --yes next start -p 3000 &
      - name: Wait for server
        run: sleep 5
      - name: Check headers
        run: |
          set -euo pipefail
          curl -sI http://localhost:3000/login | grep -iE 'content-security-policy|x-frame-options|x-content-type-options|referrer-policy|permissions-policy|strict-transport-security'
